name: Perfect Store CI

on:
  push:
    branches: [main, production-readiness]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: One-time lockfile remediation for current PR
        if: github.head_ref == 'fix/single-store-public-rls'
        run: |
          npm install --save-exact zod@4.6.7 puppeteer-core@25.16.0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: remediate dependency security advisories"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Dependency security audit
        run: npm audit --audit-level=low
      - name: TypeScript type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
