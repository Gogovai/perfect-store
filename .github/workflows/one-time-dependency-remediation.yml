name: One-time dependency lock refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'fix/single-store-public-rls'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade vulnerable Zod and Puppeteer dependencies
        run: npm install --save-exact zod@4.6.7 puppeteer-core@25.16.0
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency lockfile changes to commit."
          else
            git commit -m "fix: remediate newly disclosed dependency vulnerabilities"
            git push origin HEAD:${{ github.head_ref }}
          fi
