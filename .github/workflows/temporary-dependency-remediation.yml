name: Temporary dependency vulnerability remediation

on:
  push:
    branches:
      - feature/single-store-hubtel

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: feature/single-store-hubtel
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update lockfile for explicitly patched framework versions
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Apply remaining non-breaking security fixes
        id: auditfix
        continue-on-error: true
        run: npm audit fix
      - name: Report any unresolved advisories
        if: always()
        run: npm audit || true
      - name: Commit updated dependency manifest and lockfile
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix: remediate npm dependency vulnerabilities"
            git push origin HEAD:feature/single-store-hubtel
          else
            echo "No safe dependency changes were produced."
          fi
