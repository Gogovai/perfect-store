name: Temporary dependency lockfile verification

on:
  push:
    branches:
      - feature/single-store-hubtel

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: feature/single-store-hubtel
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact lockfile
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=low
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit lockfile updates
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync dependency lockfile"
            git push origin HEAD:feature/single-store-hubtel
          else
            echo "Lockfile is already synchronized."
          fi
